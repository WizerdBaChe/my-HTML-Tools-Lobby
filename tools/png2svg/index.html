<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG / JPG → SVG 向量化工具</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
:root {
  --bg: #f7f5f2;
  --panel: #ffffff;
  --border: #e2e0dc;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --muted-2: #999999;
  --tint: #f1efe9;
  --error: #c0392b;
  --font: "DM Sans", "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "DM Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* sticky black header */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--text);
  color: #fff;
}
.header-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px 20px;
}
.site-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.36px;
  line-height: 1.5;
}
.site-sub {
  margin: 2px 0 0;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted-2);
  letter-spacing: 0.22px;
}

.main-content {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

/* settings toolbar (segmented engine picker + mode) */
.settings-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 14px;
}
.seg { display: inline-flex; gap: 0; }
.bg-btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  height: 30px;
  padding: 0 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.bg-btn + .bg-btn { margin-left: 6px; }
.bg-btn.active {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}
.bg-btn:not(.active):hover { border-color: var(--text); color: var(--text); }
.field {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}
.field select {
  font-family: var(--font);
  font-size: 13px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  height: 30px;
  cursor: pointer;
}
.field select:disabled { color: var(--muted-2); background: var(--tint); cursor: not-allowed; }
.bar-hint { font-size: 12px; color: var(--muted); }

.auto-info {
  font-size: 12px;
  color: var(--text);
  background: var(--tint);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  margin-bottom: 14px;
  display: none;
}
.auto-info.show { display: block; }

/* drop zone */
#dropzone {
  border: 2px dashed var(--border);
  border-radius: 6px;
  background: var(--panel);
  padding: 48px 24px;
  text-align: center;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
#dropzone.hover, #dropzone:hover { border-color: var(--text); background: #fff; }
.drop-title { display: block; font-size: 16px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.drop-hint { display: block; font-size: 13px; color: var(--muted); }

#workspace { display: none; margin-top: 14px; }
#workspace.show { display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  min-width: 0;
}
.card h2 {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .2px;
}
.card + .card { margin-top: 14px; }

.preview-wrap {
  background: repeating-conic-gradient(#eceae4 0 25%, #f6f4ef 0 50%) 50% / 16px 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 280px;
  max-height: 460px;
  overflow: auto;
  padding: 12px;
}
.preview-wrap img { max-width: 100%; max-height: 420px; object-fit: contain; }
.preview-wrap svg { max-width: 100%; max-height: 420px; height: auto; }
.preview-wrap.empty::before { content: "尚未產生結果"; color: var(--muted-2); font-size: 13px; }
.file-meta { margin-top: 8px; font-size: 12px; color: var(--muted); font-family: var(--mono); }

.settings .row { margin-bottom: 16px; }
.settings label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.settings .hint { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
.settings input[type=range] { width: 100%; accent-color: var(--text); }
.range-val { font-family: var(--mono); font-weight: 500; color: var(--text); }

.bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
button {
  font-family: var(--font);
  background: var(--text);
  color: #fff;
  border: 1px solid var(--text);
  border-radius: 4px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s;
}
button:hover { background: #333; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:hover:disabled { background: var(--text); }
button.secondary { background: transparent; color: var(--muted); border-color: var(--border); }
button.secondary:hover { background: var(--tint); color: var(--text); border-color: var(--text); }

#status { font-size: 12px; color: var(--muted); font-family: var(--mono); }
#status.error { color: var(--error); }
#status.ok { color: var(--text); }

#fullscreen {
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}
#fullscreen.show { display: flex; }
#fullscreen .box { max-width: 92vw; max-height: 92vh; background: #fff; border-radius: 6px; padding: 12px; overflow: auto; }
#fullscreen .box svg { max-width: 88vw; max-height: 84vh; height: auto; }

@media (max-width: 720px) {
  .grid2 { grid-template-columns: 1fr; }
  .settings-bar { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1 class="site-title">PNG / JPG → SVG 向量化工具</h1>
    <p class="site-sub">把點陣圖轉成可無限放大的向量圖（SVG）。所有運算都在你的瀏覽器完成，圖片不會上傳。</p>
  </div>
</header>

<main class="main-content">
  <section class="settings-bar">
    <div class="seg" id="autoSeg">
      <button type="button" class="bg-btn active" id="autoBtnOn">自動選引擎</button>
      <button type="button" class="bg-btn" id="autoBtnOff">手動指定</button>
      <input type="checkbox" id="autoEng" hidden checked>
    </div>
    <div class="field">
      <label for="mode">轉換模式</label>
      <select id="mode">
        <option value="stable" selected>穩定線條（線條最平滑）</option>
        <option value="color">彩色（保留多種顏色）</option>
        <option value="bw">黑白線稿（適合 logo）</option>
        <option value="gray">灰階（保留明暗）</option>
      </select>
    </div>
    <span class="bar-hint">自動模式依圖片內容挑引擎，也可手動指定</span>
  </section>

  <div class="auto-info" id="autoInfo"></div>

  <div id="dropzone">
    <b class="drop-title">把圖片拖到這裡，或點一下選擇檔案</b>
    <span class="drop-hint">支援 PNG / JPG / JPEG / WEBP</span>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
  </div>

  <div id="workspace">
    <div class="grid2">
      <section class="card">
        <h2>原始圖片</h2>
        <div class="preview-wrap" id="origWrap"><img id="origImg" alt=""></div>
        <div class="file-meta" id="fileMeta"></div>
      </section>

      <section class="card">
        <h2>SVG 結果</h2>
        <div class="preview-wrap empty" id="svgWrap" title="點擊可放大檢視"></div>
        <div class="bar">
          <button id="download" disabled>下載 SVG</button>
          <button id="copyCode" class="secondary" disabled>複製 SVG 程式碼</button>
          <span id="status"></span>
        </div>
      </section>
    </div>

    <section class="card settings">
      <h2>轉換設定</h2>

      <div class="row">
        <label for="colors">色彩數量：<span class="range-val" id="colorsVal">16</span></label>
        <input type="range" id="colors" min="2" max="64" step="1" value="16">
        <span class="hint">越少 → 色塊越簡潔；越多 → 越接近原圖，但檔案較大</span>
      </div>

      <div class="row">
        <label for="smooth">線條平滑度：<span class="range-val" id="smoothVal">5</span></label>
        <input type="range" id="smooth" min="1" max="10" step="1" value="5">
        <span class="hint">越高 → 曲線越圓滑、路徑越少；越低 → 越貼合原圖細節</span>
      </div>

      <div class="row">
        <label for="noise">去除雜點：<span class="range-val" id="noiseVal">8</span></label>
        <input type="range" id="noise" min="0" max="50" step="1" value="8">
        <span class="hint">忽略小於此面積的碎塊（像素）。越大 → 越乾淨但細節越少</span>
      </div>

      <div class="row">
        <label for="blur">模糊去雜訊：<span class="range-val" id="blurVal">3</span></label>
        <input type="range" id="blur" min="0" max="10" step="1" value="3">
        <span class="hint">圖片顆粒感重時調高，會先柔化再向量化。照片類建議開 3 以上</span>
      </div>
    </section>
  </div>
</main>

<div id="fullscreen"><div class="box" id="fsBox"></div></div>

    } else {
      autoInfo.textContent = '偵測：' + detected.nColors + ' 種顏色、硬邊 ' +
        detected.hardRatio + '%' + (detected.flat ? '（色塊分明）' : '（漸層／軟邊）') +
        ' → 使用「' + engName + '」';
    }
    autoInfo.classList.add('show');
  }

  // ---- Controls ---------------------------------------------------------
  function hintKey(engine) {
    if (!autoMode) return mode.value === 'stable' ? 'stable' : mode.value;
    return engine === 'stable' ? 'stable' : 'color';
  }

  const MODE_HINTS = {
    color: {
      smooth: '越高 → 曲線越圓滑、路徑越少；越低 → 越貼合原圖細節',
      noise: '忽略小於此面積的碎塊（像素）。越大 → 越乾淨但細節越少',
      colors: '越少 → 色塊越簡潔；越多 → 越接近原圖，但檔案較大'
    },
    bw: {
      smooth: '越高 → 線條越平滑、路徑越少；越低 → 越貼合原圖細節',
      noise: '忽略小於此面積的碎塊（像素）。越大 → 越乾淨但細節越少',
      colors: '黑白模式下此設定不影響結果'
    },
    gray: {
      smooth: '越高 → 線條越平滑、路徑越少；越低 → 越貼合原圖細節',
      noise: '忽略小於此面積的碎塊（像素）。越大 → 越乾淨但細節越少',
      colors: '灰階模式下此設定不影響結果'
    },
    stable: {
      smooth: '「失真容忍度」：越高 → 線條越直越平滑，但越偏離原圖輪廓',
      noise: '丟棄小於此面積的色塊（像素）。越大 → 色塊越整潔',
      colors: '越少 → 色塊越簡潔、檔案越小；越多 → 越接近原圖'
    }
  };

  function applyModeHints() {
    const h = MODE_HINTS[hintKey(resolveEngine())] || MODE_HINTS.color;
    const hints = document.querySelectorAll('.settings .row .hint');
    hints[0].textContent = h.colors;
    hints[1].textContent = h.smooth;
    hints[2].textContent = h.noise;
  }

  function refreshSliders() {
    $('colorsVal').textContent = colors.value;
    $('smoothVal').textContent = smooth.value;
    $('noiseVal').textContent = noise.value;
    $('blurVal').textContent = blur.value;
  }

  // sliders: update label live, but only trace when the user releases the thumb
  ['colors', 'smooth', 'noise', 'blur'].forEach(id => {
    $(id).addEventListener('input', refreshSliders);
    $(id).addEventListener('change', () => { scheduleTrace(); applyModeHints(); });
  });

  mode.addEventListener('change', () => setAutoMode(false));

  function scheduleTrace() {
    clearTimeout(traceTimer);
    traceTimer = setTimeout(requestTrace, 300);
  }

  function buildOptions(engine) {
    if (engine === 'stable') {
      return {
        nColors: parseInt(colors.value, 10),
        blurR: parseInt(blur.value, 10),
        modeIters: 1,
        minArea: parseInt(noise.value, 10) * 2,
        tol: parseFloat(smooth.value) * 0.3,
        round: 1,
        seed: 42
      };
    }
    // potrace family: smoothness 1..10 maps to ltres/qtres 10..0.1 (higher = smoother)
    const t = Math.round(10 / smooth.value * 10) / 10;
    const opt = {
      ltres: t,
      qtres: t,
      pathomit: parseInt(noise.value, 10),
      blurradius: parseInt(blur.value, 10),
      linefilter: true,
      strokewidth: 0,
      roundcoords: 1
    };
    if (mode.value === 'color') {
      opt.colorsampling = 2;
      opt.numberofcolors = parseInt(colors.value, 10);
      opt.colorquantcycles = 3;
    } else if (mode.value === 'gray') {
      opt.colorsampling = 0;
      opt.numberofcolors = 7;
    } else {
      opt.colorsampling = 0;
      opt.numberofcolors = 2;
    }
    return opt;
  }

  // ---- Trace (async via worker, sync fallback) --------------------------
  function requestTrace() {
    if (!currentImgData) return;
    const engine = resolveEngine();
    applyModeHints();
    const options = buildOptions(engine);
    jobSeq++;
    const id = jobSeq;

    if (worker) {
      setStatus(engine === 'potrace' ? '向量化中…' : '穩定線條運算中…（背景運算，畫面不會卡住）');
      pendingJob = { id: id, engine: engine };
      worker.postMessage({
        id: id,
        kind: engine,
        data: currentImgData.data,
        width: currentImgData.width,
        height: currentImgData.height,
        options: options
      }); // structured clone copies the pixel buffer; keeps main-thread data intact
      return;
    }

    // fallback: run on the main thread
    setStatus('向量化中…');
    setTimeout(() => {
      if (id !== jobSeq) return;
      try {
        const t0 = performance.now();
        const res = runEngine(engine, options);
        if (id !== jobSeq) return;
        renderResult(res, engine, performance.now() - t0);
      } catch (e) {
        setStatus('向量化失敗：' + e.message, 'error');
        downloadBtn.disabled = true;
        copyBtn.disabled = true;
      }
    }, 30);
  }

  function runEngine(engine, options) {
    if (engine === 'stable') {
      return Stabilizer.convert(currentImgData.data, currentImgData.width, currentImgData.height, options);
    }
    return ImageTracer.imagedataToSVG(currentImgData, options);
  }

  function onWorkerMessage(e) {
    const msg = e.data;
    if (!pendingJob || msg.id !== pendingJob.id) { return; } // stale result — ignore
    const engine = pendingJob.engine;
    pendingJob = null;
    if (!msg.ok) {
      currentSvg = '';
      setStatus('向量化失敗：' + msg.error, 'error');
      downloadBtn.disabled = true;
      copyBtn.disabled = true;
      return;
    }
    renderResult(msg.result, engine, msg.ms);
  }

  function renderResult(result, engine, ms) {
    let svg, stats;
    if (engine === 'potrace') {
      svg = result;
      stats = '路徑數 ' + (svg.match(/<path/g) || []).length;
    } else {
      svg = result.svg;
      stats = '形狀數 ' + result.totalLoops + '　色彩 ' + result.nColorsUsed;
    }
    currentSvg = svg;
    svgWrap.innerHTML = svg;
    svgWrap.classList.remove('empty');
    svgWrap.title = '點擊可放大檢視';

    const sizeKB = (new Blob([svg]).size / 1024).toFixed(1);
    const origKB = (currentImgData.width * currentImgData.height * 4 / 1024).toFixed(0);
    let warn = '';
    if (parseFloat(sizeKB) > 1024) {
      warn = '　提示：檔案偏大，可降低色彩數量或調高「去除雜點」';
    }
    setStatus('完成　花費 ' + Math.round(ms) + ' ms　' + stats +
      '　SVG ' + sizeKB + ' KB（原圖像素約 ' + origKB + ' KB）' + warn, 'ok');
    downloadBtn.disabled = false;
    copyBtn.disabled = false;
  }

  downloadBtn.addEventListener('click', () => {
    if (!currentSvg) return;
    const blob = new Blob([currentSvg], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'traced.svg';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(currentSvg).then(() => {
      const old = copyBtn.textContent;
      copyBtn.textContent = '已複製 ✓';
      setTimeout(() => { copyBtn.textContent = old; }, 1200);
    });
  });

  svgWrap.addEventListener('click', () => {
    if (!currentSvg) return;
    $('fsBox').innerHTML = currentSvg;
    $('fullscreen').classList.add('show');
  });
  $('fullscreen').addEventListener('click', () => $('fullscreen').classList.remove('show'));
})();
</script>
</body>
</html>
